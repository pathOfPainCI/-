name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check signing secrets configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::未配置签名 Secrets！请在仓库 Settings → Secrets and variables → Actions 中添加 4 个 Secret：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD，然后重新运行本工作流。"
            exit 1
          fi
          echo "signing secrets ok"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > keystore.p12
          SIZE=$(stat -c%s keystore.p12)
          echo "keystore size: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::keystore.p12 解码后异常（$SIZE 字节，期望约 2358）。KEYSTORE_BASE64 的值可能复制错了：请打开桌面 SECRETS_GUIDE.txt，只复制【值 1】那一整行（由字母、数字、+、/、= 组成），在 Settings → Secrets 里删除旧 KEYSTORE_BASE64 后重新添加。"
            exit 1
          fi
          sha256sum keystore.p12

      # 仓库不含 gradle wrapper（离线环境无法生成二进制 jar），
      # 用 setup-gradle 提供的 gradle 命令直接构建。
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests (domain layer)
        env:
          KEYSTORE_FILE: keystore.p12
          KEYSTORE_TYPE: PKCS12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest

      - name: Build release APK
        env:
          KEYSTORE_FILE: keystore.p12
          KEYSTORE_TYPE: PKCS12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verify APK signature (fail if unsigned)
        run: |
          APK=$(ls app/build/outputs/apk/release/*-release.apk | head -1)
          echo "Verifying: $APK"
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*-release.apk

      - name: Publish GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*-release.apk
