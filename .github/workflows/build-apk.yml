name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check signing secrets configured
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::未配置签名 Secrets！请在仓库 Settings → Secrets and variables → Actions 中添加：KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD（KEYSTORE_PASSWORD 和 KEY_PASSWORD 填 AutoBook2026SecureKey01，KEY_ALIAS 填 release），然后重新运行本工作流。"
            exit 1
          fi
          echo "signing secrets ok"

      - name: Decrypt signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # keystore.enc 已提交到仓库（AES-256-CBC + PBKDF2 加密，密码在 Secret 中）
          openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$KEYSTORE_PASSWORD" -in signing/keystore.enc -out keystore.p12
          SHA=$(sha256sum keystore.p12 | cut -d' ' -f1)
          echo "sha256: $SHA"
          if [ "$SHA" != "bd870eef81f0a03270a9e9a199ec2e2d0e80d179e0f1da73fddb7265a59c873f" ]; then
            echo "::error::keystore 解密校验失败！请确认仓库 Secret KEYSTORE_PASSWORD 的值是 AutoBook2026SecureKey01（Settings → Secrets and variables → Actions），然后重新运行本工作流。"
            exit 1
          fi
          echo "keystore verified OK"

      - name: Detect keystore alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # JDK 9+ 输出格式：alias, 日期, PrivateKeyEntry,
          ALIAS=$(keytool -list -keystore keystore.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep 'PrivateKeyEntry' | head -1 | sed 's/,.*//' | tr -d ' ')
          if [ -z "$ALIAS" ]; then
            echo "::error::无法读取 keystore 别名。请确认 Secret KEYSTORE_PASSWORD 的值是 AutoBook2026SecureKey01。"
            exit 1
          fi
          echo "detected alias: $ALIAS"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      # 仓库不含 gradle wrapper（离线环境无法生成二进制 jar），
      # 用 setup-gradle 提供的 gradle 命令直接构建。
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests (domain layer)
        env:
          KEYSTORE_FILE: keystore.p12
          KEYSTORE_TYPE: PKCS12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest

      - name: Build release APK
        env:
          KEYSTORE_FILE: keystore.p12
          KEYSTORE_TYPE: PKCS12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verify APK signature (fail if unsigned)
        run: |
          APK=$(ls app/build/outputs/apk/release/*-release.apk | head -1)
          echo "Verifying: $APK"
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*-release.apk

      - name: Publish GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*-release.apk
